
name: Build AzmoonKadeh APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AzmoonKadehAndroid_Project.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          unzip -q AzmoonKadehAndroid_Project.zip
          test -f AzmoonKadehAndroid/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p AzmoonKadehAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AzmoonKadeh-debug-APK
          path: AzmoonKadehAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
